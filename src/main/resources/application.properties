# OpenAPI Configuration
spring.application.name=backend
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method

# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:taskprocessing
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Reduce Spring Boot startup noise
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.level.com.zaxxer.hikari=WARN

# Show your app logs clearly
logging.level.dev.jjcoll.distributedtaskviz=DEBUG

# Cleaner console output
spring.main.banner-mode=off

# Worker Simulation Configuration
# Maximum number of concurrent workers allowed
worker.simulation.max-workers=10

# Worker Simulation Engine Control
# Set to true to start processing engine automatically on application startup
# Set to false to require manual start via POST /api/engine/start
worker.simulation.auto-start=false